[versions]
agp = "9.2.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
activity = "1.13.0"
constraintlayout = "2.2.1"
recyclerview = "1.4.0"
legacySupportV4 = "1.0.0"
gridlayout = "1.1.0"
activityKtx = "1.13.0"

# Firebase
firebaseBom = "33.14.0"

# Google
playServicesAuth = "21.3.0"
playServicesCodeScanner = "16.1.0"

# Facebook
facebookLogin = "17.0.2"

# Image loading
glide = "4.16.0"

# QR / Barcode
zxingCore = "3.5.3"

# Networking
retrofit = "2.11.0"
okhttpLogging = "4.12.0"

# Security
securityCrypto = "1.1.0-alpha06"

# Credential Manager (thay thế GoogleSignIn đã deprecated)
credentialManager = "1.3.0"
googleIdentity = "1.1.1"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
extJunit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espressoCore = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
legacySupportV4 = { group = "androidx.legacy", name = "legacy-support-v4", version.ref = "legacySupportV4" }
gridlayout = { group = "androidx.gridlayout", name = "gridlayout", version.ref = "gridlayout" }
activityKtx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }

# Firebase
firebaseBom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebaseAuth = { group = "com.google.firebase", name = "firebase-auth" }
firebaseFirestore = { group = "com.google.firebase", name = "firebase-firestore" }
firebaseStorage = { group = "com.google.firebase", name = "firebase-storage" }

# Google
playServicesAuth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }
playServicesCodeScanner = { group = "com.google.android.gms", name = "play-services-code-scanner", version.ref = "playServicesCodeScanner" }

# Facebook
facebookLogin = { group = "com.facebook.android", name = "facebook-login", version.ref = "facebookLogin" }

# Image loading
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
glideCompiler = { group = "com.github.bumptech.glide", name = "compiler", version.ref = "glide" }

# QR / Barcode
zxingCore = { group = "com.google.zxing", name = "core", version.ref = "zxingCore" }
zxingJavase = { group = "com.google.zxing", name = "javase", version.ref = "zxingCore" }

# Networking
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofitGson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttpLogging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttpLogging" }

# Security
securityCrypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# Credential Manager
credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentialManager" }
credentialsPlayServicesAuth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentialManager" }
googleIdentity = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleIdentity" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
